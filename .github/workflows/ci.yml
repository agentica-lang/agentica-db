name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.16.0
  AGENTICA_SHA256: ed20b325318c99289acec8ce4d4265ca29df52143f5429e9e66778bc60f82fbe

jobs:
  # The whole suite runs twice, once per MySQL server: MariaDB 11 and MySQL 8.4 differ (MySQL does not prepare
  # START TRANSACTION, and types some columns differently), and the adapter must work with both.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb-11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -ppw
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite, libpq and libmariadb
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          agentica --version
          for file in *.agc */*.agc specs/fixtures/*/*.agc; do agentica check "$file"; done

      # The features of specs/ and the unit tests of test/. The variables point the postgres and mysql scenarios at the
      # service containers; without them they fail. The mysql host is an address: `localhost` means the local socket
      # to the client library.
      - name: Test
        env:
          AGENTICA_DB_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          AGENTICA_DB_MYSQL_URL: mysql://root:pw@127.0.0.1:3306/mysql
        run: agentica test
