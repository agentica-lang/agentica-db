name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The package needs Agentica 0.26.1 (native modules, and native resources in a package): .github/actions/agentica
  # builds the commit of the tag 0.26.1 of agentica-lang/agentica.
  AGENTICA_COMMIT: 88f8bb3498ca86959f3e8dc7626d89de17e74ddf

jobs:
  # The whole suite runs twice, once per MySQL server: MariaDB 11 and MySQL 8.4 differ (MySQL does not prepare
  # START TRANSACTION, and types some columns differently), and the adapter must work with both.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A run that builds Agentica (the first of a commit) takes most of it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb-11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -ppw
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite, libpq and libmariadb
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3

      - name: Agentica
        uses: ./.github/actions/agentica
        with:
          commit: ${{ env.AGENTICA_COMMIT }}

      - name: Check
        run: |
          agentica --version
          make check
          (cd src/db && agentica fmt --check *.agc sqlite postgres mysql support orm examples specs test)
          (cd src/pool && agentica fmt --check *.agc specs test)
          make site-samples

      # The sqlite job of macOS and Windows runs the scenarios named "on sqlite" (an outline has "on <adapter>"), so a
      # scenario with none of those names, which only the server-less runs would miss, is a failure here.
      - name: Scenario names
        run: |
          bad=$(grep -HnE '^\s*Scenario' src/db/specs/*.feature | grep -vE '^src/db/specs/(postgres|mysql)\.feature' \
            | grep -vE 'on (<adapter>|sqlite|postgres|mysql)|The users example' || true)
          [ -z "$bad" ] || { echo "$bad"; echo "name each scenario 'on <adapter>' or 'on sqlite'"; exit 1; }

      # The features of src/db/specs/ and the unit tests of src/db/test/, four files at once. The variables point the
      # postgres and mysql scenarios at the service containers; without them they fail. The mysql host is an address:
      # `localhost` means the local socket to the client library.
      - name: Test
        env:
          AGENTICA_DB_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          AGENTICA_DB_MYSQL_URL: mysql://root:pw@127.0.0.1:3306/mysql
        run: |
          (cd src/db && agentica test --jobs 4)
          (cd src/pool && agentica test --jobs 4)

      # The SQLite and PostgreSQL scenarios again on the FFI drivers, which run where the native library is missing;
      # @native are the scenarios of what only the native drivers have (the statement cache, batches, cancels).
      - name: Test the FFI driver
        env:
          AGENTICA_DB_SQLITE_DRIVER: ffi
          AGENTICA_DB_POSTGRES_DRIVER: ffi
          AGENTICA_DB_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
        run: |
          (cd src/db && agentica test --jobs 4 --only "on sqlite" --tags "not @native")
          (cd src/db && agentica test --jobs 4 --only "on postgres" --tags "not @native")
          (cd src/db && agentica test --jobs 4 specs/postgres.feature)

  # The SQLite scenarios on macOS and Windows. A service container runs on Linux only, so the PostgreSQL and MySQL
  # scenarios stay in the job above; here `--only "on sqlite"` keeps the SQLite ones (every one has that in its name).
  # SQLite is the system library: libsqlite3.dylib on macOS, winsqlite3.dll in System32 on Windows.
  sqlite:
    name: sqlite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A run that builds Agentica (the first of a commit) takes most of it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agentica
        uses: ./.github/actions/agentica
        with:
          commit: ${{ env.AGENTICA_COMMIT }}

      - name: Check
        shell: bash
        run: |
          agentica --version
          cd src/db
          agentica check *.agc sqlite postgres mysql support orm examples specs test
          agentica fmt --check *.agc sqlite postgres mysql support orm examples specs test
          cd ../pool
          agentica check *.agc specs test
          agentica fmt --check *.agc specs test

      # The SQLite scenarios, the users example (a scenario of examples.feature), the unit tests of src/db/test/, which
      # need no connection, and the features of the pool package, which use a fake resource.
      - name: Test
        shell: bash
        run: |
          cd src/db
          agentica test --jobs 4 --only "on sqlite"
          agentica test --jobs 4 --only "users example"
          agentica test --jobs 4 test
          cd ../pool
          agentica test --jobs 4
