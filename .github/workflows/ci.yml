name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The package needs Agentica 0.31.0: .github/actions/agentica
  # builds the commit of the tag 0.31.0 of agentica-lang/agentica.
  AGENTICA_COMMIT: e90cf1207f8424745f7f67d28f6b67459d3b5bf3

jobs:
  # The whole suite runs twice, once per MySQL server: MariaDB 11 and MySQL 8.4 differ (MySQL does not prepare
  # START TRANSACTION, and types some columns differently), and the adapter must work with both.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A run that builds Agentica (the first of a commit) takes most of it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb-11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -ppw
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite, libpq and libmariadb
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3

      - name: Agentica
        uses: ./.github/actions/agentica
        with:
          commit: ${{ env.AGENTICA_COMMIT }}

      - name: Check
        run: |
          agentica --version
          make check
          make fmt-check
          make site-samples

      # The sqlite job of macOS and Windows runs the scenarios named "on sqlite" (an outline has "on <adapter>"), so a
      # scenario with none of those names, which only the server-less runs would miss, is a failure here.
      - name: Scenario names
        run: |
          bad=$(grep -HnE '^\s*Scenario' src/db/specs/*.feature | grep -vE '^src/db/specs/(postgres|mysql)\.feature' \
            | grep -vE 'on (<adapter>|sqlite|postgres|mysql)|The users example' || true)
          [ -z "$bad" ] || { echo "$bad"; echo "name each scenario 'on <adapter>' or 'on sqlite'"; exit 1; }

      # The features of src/db/specs/ and the unit tests of src/db/test/, four scenarios at once, on each driver where
      # there are two. The variables name the driver outright, so a run cannot fall back to the other one: `native` is
      # an error when the module did not build, `ffi` skips the native module, and the scenarios of
      # driver_choice.feature fail when the connection runs another driver than the variable names. The ffi run leaves out @native, the
      # scenarios of what only the native drivers have (the statement cache, batches, cancels). It runs after the native
      # one, which has the unit tests of src/db/test/ (a run with tags has none). MySQL and MariaDB have the FFI driver
      # only: their native driver joins this loop with agentica-lang/agentica-db#77. The variables point the postgres
      # and mysql scenarios at the service containers; without them they fail. The mysql host is an address:
      # `localhost` means the local socket to the client library.
      - name: Test (native and FFI drivers)
        env:
          AGENTICA_DB_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          AGENTICA_DB_MYSQL_URL: mysql://root:pw@127.0.0.1:3306/mysql
        run: |
          for driver in native ffi; do
            echo "::group::src/db on the $driver drivers"
            export AGENTICA_DB_SQLITE_DRIVER=$driver AGENTICA_DB_POSTGRES_DRIVER=$driver
            tags=()
            [ "$driver" = native ] || tags=(--tags "not @native")
            (cd src/db && agentica test --jobs 4 "${tags[@]}")
            # The properties of src/properties: the round trip of a row on each driver, and, on the native run, the
            # rest (the pool, and the scanners of the native SQLite driver, which read its statement cache).
            paths=()
            [ "$driver" = native ] || paths=(test/values_test.agc)
            (cd src/properties && agentica test --jobs 4 "${paths[@]}")
            echo "::endgroup::"
          done

  # No C compiler: the native modules are optional, so a program warns that db_sqlite is not built and runs the FFI
  # driver. The job removes `cc` and `gcc` from the runner after building Agentica, checks the warning on the users
  # example, and runs the SQLite scenarios with the driver variable unset, so they pass on the fallback.
  no-compiler:
    name: sqlite (no C compiler)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: Agentica
        uses: ./.github/actions/agentica
        with:
          commit: ${{ env.AGENTICA_COMMIT }}

      - name: Remove the C compiler
        run: |
          sudo rm -f $(which -a cc gcc c89 c99 clang || true)
          ! command -v cc && ! command -v gcc

      - name: Test (fallback to the FFI driver)
        run: |
          cd src/db
          agentica install
          agentica examples/users.agc 2> warnings.txt
          cat warnings.txt
          [ "$(grep -c 'warning: native module db_sqlite not built' warnings.txt)" = 1 ]
          unset AGENTICA_DB_SQLITE_DRIVER
          agentica test --jobs 4 --only "on sqlite" --tags "not @native"
          agentica test --jobs 4 --only "users example" --tags "not @native"

  # The SQLite scenarios on macOS and Windows, on the native and the FFI driver. A service container runs on Linux only,
  # so the PostgreSQL and MySQL scenarios stay in the job above; here `--only "on sqlite"` keeps the SQLite ones (every
  # one has that in its name). SQLite is the system library: libsqlite3.dylib on macOS, winsqlite3.dll in System32 on
  # Windows.
  sqlite:
    name: sqlite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A run that builds Agentica (the first of a commit) takes most of it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agentica
        uses: ./.github/actions/agentica
        with:
          commit: ${{ env.AGENTICA_COMMIT }}

      - name: Check
        shell: bash
        run: |
          agentica --version
          cd src/db
          agentica install
          agentica check *.agc sqlite postgres mysql support orm examples specs test
          agentica fmt --check *.agc sqlite postgres mysql support orm examples specs test
          cd ../properties
          agentica install
          agentica check *.agc test
          agentica fmt --check *.agc test

      # The SQLite scenarios and the users example (a scenario of examples.feature) on each driver, named outright as
      # in the job above (see there for what the variable and the tags do); then the unit tests of src/db/test/, which
      # need no connection.
      - name: Test (native and FFI drivers)
        shell: bash
        run: |
          cd src/db
          for driver in native ffi; do
            echo "::group::sqlite on the $driver driver"
            export AGENTICA_DB_SQLITE_DRIVER=$driver
            tags=()
            [ "$driver" = native ] || tags=(--tags "not @native")
            agentica test --jobs 4 --only "on sqlite" "${tags[@]}"
            agentica test --jobs 4 --only "users example" "${tags[@]}"
            echo "::endgroup::"
          done
          agentica test --jobs 4 test
          # The properties named "on sqlite" (the round trip of a row, and the scanners of the native driver), on each
          # driver; the scanners read the statement cache, which only the native driver has.
          cd ../properties
          for driver in native ffi; do
            export AGENTICA_DB_SQLITE_DRIVER=$driver
            paths=()
            [ "$driver" = native ] || paths=(test/values_test.agc)
            agentica test --jobs 4 --only "on sqlite" "${paths[@]}"
          done
