name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.17.0
  AGENTICA_SHA256: bca1bb67ef56432b25d11f8d37b4fcbc1f3a71fdb01b60bb713357d3c9f35646

jobs:
  # The whole suite runs twice, once per MySQL server: MariaDB 11 and MySQL 8.4 differ (MySQL does not prepare
  # START TRANSACTION, and types some columns differently), and the adapter must work with both.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb-11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -ppw
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.image }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite, libpq and libmariadb
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          agentica --version
          make check
          make site-samples

      # The sqlite job of macOS and Windows runs the scenarios named "on sqlite" (an outline has "on <adapter>"), so a
      # scenario with none of those names, which only the server-less runs would miss, is a failure here.
      - name: Scenario names
        run: |
          bad=$(grep -HnE '^\s*Scenario' specs/*.feature | grep -vE '^specs/(postgres|mysql)\.feature' \
            | grep -vE 'on (<adapter>|sqlite|postgres|mysql)|The users example' || true)
          [ -z "$bad" ] || { echo "$bad"; echo "name each scenario 'on <adapter>' or 'on sqlite'"; exit 1; }

      # The features of specs/ and the unit tests of test/. The variables point the postgres and mysql scenarios at the
      # service containers; without them they fail. The mysql host is an address: `localhost` means the local socket
      # to the client library.
      - name: Test
        env:
          AGENTICA_DB_POSTGRES_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          AGENTICA_DB_MYSQL_URL: mysql://root:pw@127.0.0.1:3306/mysql
        run: agentica test

  # The SQLite scenarios on macOS and Windows. A service container runs on Linux only, so the PostgreSQL and MySQL
  # scenarios stay in the job above; here `--only "on sqlite"` keeps the SQLite ones (every one has that in its name).
  # SQLite is the system library: libsqlite3.dylib on macOS, winsqlite3.dll in System32 on Windows.
  sqlite:
    name: sqlite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            sha256: a83e1b6b237df02479d77a891f8d17471c2ad7cd3f1b8cca38000e9db5138e2e
          - name: macos-x86_64
            runner: macos-15-intel
            sha256: 01bc072baecc2bc0c5bdcb803a0a4ec29920f79b0cea85ac689c4e65b7b48f73
          - name: windows-x86_64
            runner: windows-latest
            sha256: 550f580aeb666cefea27870199ba80428340b9d0127ea7245392dffaf0afe726
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release (macOS)
        if: runner.os == 'macOS'
        run: |
          archive="agentica-${AGENTICA_VERSION}-${{ matrix.name }}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-${{ matrix.name }}/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Agentica release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "agentica-$env:AGENTICA_VERSION-${{ matrix.name }}"
          $archive = Join-Path $env:RUNNER_TEMP "$dir.zip"
          $base = "https://github.com/agentica-lang/agentica/releases/download/$env:AGENTICA_VERSION"
          Invoke-WebRequest -Uri "$base/$dir.zip" -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($hash -ne "${{ matrix.sha256 }}") { throw "sha256 mismatch: $hash" }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "$dir\bin")

      - name: Check
        shell: bash
        run: |
          agentica --version
          sh tools/check.sh

      # The SQLite scenarios, the users example (a scenario of examples.feature) and the unit tests of test/, which
      # need no connection.
      - name: Test
        shell: bash
        run: |
          agentica test --only "on sqlite"
          agentica test --only "users example"
          agentica test test
